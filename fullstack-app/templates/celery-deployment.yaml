apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fullstack-app.fullname" . }}-celery
  labels:
    {{- include "fullstack-app.labels" . | nindent 4 }}
    app: celery
spec:
  replicas: {{ .Values.celery.replicaCount }}
  selector:
    matchLabels:
      app: celery
  template:
    metadata:
      labels:
        {{- include "fullstack-app.labels" . | nindent 8 }}
        app: celery
    spec:
      containers:
      - name: celery-worker
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        command:
          - celery
        args:
          - -A
          - app.celery
          - worker
          - --loglevel=info
          - --concurrency={{ .Values.celery.concurrency }}
        env:
          - name: REDIS_HOST
            value: "fullstack-app-rel-redis"
          - name: REDIS_PORT
            value: "6379"